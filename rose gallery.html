<head>
		<style>

		.container {
    			display: flex;
    			flex-direction: row;
    			gap: 20px;
    			justify-content: center;
		}

		.box {
    			width: 200px;
    			height: 200px;
    			border: 2px solid black;
		}

		.box img {
    			width: 100%;
    			height: 100%;
    			object-fit: cover;
		}

		</style>
	</head>

	<body>
		<h2>Rose Gallery - Flex Row Layout</h2>
		<div class="container">   
			<div class="box"><img src="pic 1 rose.PNG" alt="Red Rose"></div>
			<div class="box"><img src="pic 2 rose.PNG" alt="Red Rose"></div>
			<div class="box"><img src="pic 3 rose.PNG" alt="Red Rose"></div>
			<div class="box"><img src="pic 4 rose.PNG" alt="Red Rose"></div>
		</div>
	

	</body>
